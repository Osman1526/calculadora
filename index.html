<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Calculadora">
<h1>Calculadora Básica</h1>

    <label for="numero1">Ingrese un Número</label>
    <input type="number" id="numero1"> <br>
    <label for="numero2">Ingrese otro Número</label>
    <input type="number" id="numero2"><br>
    <h1 id="resultado"></h1>

    <div class="botones">
    <button onclick="suma()">+</button>
    <button onclick="resta()">-</button>
    <button onclick="multiplicacion()">*</button>
    <button onclick="division()">/</button>
    <button onclick="potenciacion()">^</button>
    <button onclick="raizcuadrada()">&radic;</button>
 </div>
</div>
<script src="script.js"></script>
 
</html>
